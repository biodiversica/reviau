[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviau"
version = "0.1.0"
description = "Browser interface for reviewing detected audio segments in bioacoustic analysis, locally or over SSH"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "biodiversica", email = "biodiversica@gmail.com" },
]
keywords = ["bioacoustics", "audio", "spectrogram", "annotation", "review", "template-matching", "vector-search", "sftp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "typer>=0.12",
    "paramiko>=3.4",
]

[project.urls]
Homepage = "https://github.com/biodiversica/reviau"
Documentation = "https://github.com/biodiversica/reviau#readme"
Repository = "https://github.com/biodiversica/reviau"
Issues = "https://github.com/biodiversica/reviau/issues"

[project.scripts]
reviau = "reviau.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reviau"]

[tool.hatch.build.targets.sdist]
include = ["src/reviau", "tests", "README.md", "README.pt-BR.md", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
