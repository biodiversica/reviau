<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reviau</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Applied before the first paint: left to app.js, which runs at the end of
    // the page, the system theme would flash before a pinned one lands.
    try {
      const pinned = localStorage.getItem('reviau.theme');
      if (pinned === 'light' || pinned === 'dark') {
        document.documentElement.dataset.theme = pinned;
      }
    } catch (e) { /* storage unavailable: follow the system */ }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎧</text></svg>">
</head>
<body>
  <header class="bar">
    <div class="bar-left">
      <span class="logo">🎧</span>
      <span class="app-title" data-i18n="app.title">reviau</span>
    </div>
    <div class="bar-right">
      <span class="counts" id="counts"></span>
      <button class="icon-btn" id="btn-rescan" data-i18n-title="toolbar.rescan_hint">⟳</button>
      <button class="icon-btn" id="btn-help" data-i18n-title="toolbar.help">?</button>
      <button class="icon-btn theme-toggle" id="btn-theme" type="button"></button>
      <select id="lang-select" data-i18n-title="toolbar.language" class="lang"></select>
    </div>
  </header>

  <form id="folder-form" class="folder-bar" autocomplete="off">
    <input id="folder-input" class="folder-input" type="text" list="recent-folders"
           spellcheck="false" data-i18n-ph="folder.placeholder" data-i18n-title="folder.hint">
    <datalist id="recent-folders"></datalist>
    <button type="button" id="btn-browse" class="btn small" data-i18n="folder.browse">Browse…</button>
    <button type="button" id="btn-reading" class="btn small" data-i18n-title="reading.button" disabled>⚙</button>
    <button type="submit" id="btn-open" class="btn small ok" data-i18n="folder.open">Open</button>
  </form>

  <main>
    <div id="notice" class="notice"></div>
    <div id="progress" class="progress"></div>
    <div id="meta" class="meta"></div>

    <section id="controls" class="controls">
      <label><span data-i18n="spec.type">Type:</span>
        <select id="spec-type">
          <option value="mel" data-i18n="spec.mel">Mel</option>
          <option value="fft" data-i18n="spec.fft">FFT (linear)</option>
          <option value="log" data-i18n="spec.log">FFT (log)</option>
        </select>
      </label>
      <label><span data-i18n="spec.fmin">Minimum (Hz):</span>
        <input id="spec-fmin" type="number" min="0" max="96000" step="100" value="0">
      </label>
      <label><span data-i18n="spec.fmax">Maximum (Hz):</span>
        <input id="spec-fmax" type="number" min="0" max="96000" step="100" value="0">
      </label>
      <label><span data-i18n="spec.db">Floor (dB):</span>
        <input id="spec-db" type="number" min="-120" max="-20" step="5" value="-80">
      </label>
      <span class="hint" data-i18n="spec.nyquist">(a maximum of 0 is the Nyquist frequency)</span>
    </section>

    <figure class="spec-wrap" id="spec-wrap">
      <img id="spec" alt="">
      <div class="spec-overlay" id="spec-loading" data-i18n="spec.loading"></div>
    </figure>

    <audio id="player" controls preload="auto"></audio>
    <div id="error" class="error"></div>

    <section id="labels-panel" class="labels-panel hidden">
      <div class="labels-head">
        <span class="row-label" id="labels-title" data-i18n="labels.row">Labels:</span>
        <button id="btn-manage" class="icon-btn small" data-i18n-title="labels.manage">✎</button>
      </div>
      <div id="label-buttons" class="label-buttons"></div>
      <div class="row labels-add">
        <input id="label-input" type="text" class="text" data-i18n-ph="labels.add_placeholder">
        <button id="btn-add-label" class="btn small" data-i18n="labels.add">Add</button>
      </div>
      <div id="labels-note" class="labels-note"></div>
    </section>

    <div id="nav-row" class="row nav">
      <button id="btn-prev" class="btn" data-i18n="nav.prev">← Previous</button>
      <button id="btn-true" class="btn ok" data-i18n="nav.true" data-i18n-title="nav.true_hint">✔ Correct</button>
      <button id="btn-false" class="btn no" data-i18n="nav.false" data-i18n-title="nav.false_hint">✘ Incorrect</button>
      <button id="btn-unsure" class="btn" data-i18n="nav.unsure" data-i18n-title="nav.unsure_hint">? Uncertain</button>
      <button id="btn-next" class="btn" data-i18n="nav.next">Next →</button>
    </div>

    <div id="ann" class="ann"></div>
  </main>

  <footer class="foot">
    <a class="home-link" href="https://biodiversica.xyz/" target="_blank"
       rel="noopener noreferrer">~/biodiversica</a>
  </footer>

  <dialog id="browse-dialog" class="browse">
    <h2 data-i18n="browse.title">Select a segments folder</h2>
    <div class="browse-path">
      <button type="button" id="browse-up" class="btn small" data-i18n="browse.up">↑ Parent folder</button>
      <code id="browse-here"></code>
    </div>
    <ul id="browse-list" class="browse-list"></ul>
    <div id="browse-error" class="error"></div>
    <div class="browse-actions">
      <span id="browse-wavs" class="hint"></span>
      <button type="button" id="browse-cancel" class="btn small" data-i18n="browse.cancel">Cancel</button>
      <button type="button" id="browse-open" class="btn small ok" data-i18n="browse.open_here">Open this folder</button>
    </div>
  </dialog>

  <dialog id="reading-dialog" class="reading">
    <h2 data-i18n="reading.title">Reading settings</h2>
    <p class="hint" data-i18n="reading.intro"></p>
    <div class="reading-grid">
      <label for="rd-preset" data-i18n="reading.pattern">Filename pattern</label>
      <div>
        <select id="rd-preset">
          <option value="default" data-i18n="reading.preset_default"></option>
          <option value="vector-search" data-i18n="reading.preset_vector"></option>
          <option value="custom" data-i18n="reading.preset_custom"></option>
        </select>
        <input id="rd-pattern" type="text" class="reading-text" spellcheck="false"
               data-i18n-ph="reading.custom_placeholder">
      </div>
      <label for="rd-datetime" data-i18n="reading.datetime">Date-time format</label>
      <input id="rd-datetime" type="text" class="reading-text" spellcheck="false">
      <label for="rd-label-from" data-i18n="reading.label_from">Label source</label>
      <select id="rd-label-from">
        <option value="auto" data-i18n="reading.from_auto"></option>
        <option value="folder" data-i18n="reading.from_folder"></option>
        <option value="filename" data-i18n="reading.from_filename"></option>
        <option value="none" data-i18n="reading.from_none"></option>
      </select>
      <label for="rd-depth" data-i18n="reading.depth">Label depth</label>
      <div>
        <input id="rd-depth" type="number" min="0" step="1" class="reading-depth">
        <span class="hint" data-i18n="reading.depth_hint"></span>
      </div>
    </div>
    <h3 data-i18n="reading.preview">Preview</h3>
    <div id="rd-summary" class="reading-summary"></div>
    <div class="reading-table-wrap"><table id="rd-samples" class="reading-table"></table></div>
    <div id="rd-error" class="error"></div>
    <div class="browse-actions">
      <span id="rd-note" class="hint"></span>
      <button type="button" id="rd-cancel" class="btn small" data-i18n="browse.cancel">Cancel</button>
      <button type="button" id="rd-apply" class="btn small ok" data-i18n="reading.apply">Apply</button>
    </div>
  </dialog>

  <dialog id="help-dialog">
    <h2 data-i18n="shortcuts.title">Keyboard shortcuts</h2>
    <dl class="keys">
      <dt><kbd>←</kbd></dt><dd data-i18n="shortcuts.prev"></dd>
      <dt><kbd>→</kbd></dt><dd data-i18n="shortcuts.next"></dd>
      <dt><kbd>T</kbd></dt><dd data-i18n="shortcuts.true"></dd>
      <dt><kbd>F</kbd></dt><dd data-i18n="shortcuts.false"></dd>
      <dt><kbd>U</kbd></dt><dd data-i18n="shortcuts.unsure"></dd>
      <dt><kbd>1</kbd>…<kbd>9</kbd></dt><dd data-i18n="shortcuts.labels"></dd>
      <dt><kbd>Space</kbd></dt><dd data-i18n="shortcuts.play"></dd>
    </dl>
    <form method="dialog"><button class="btn" data-i18n="shortcuts.close">Close</button></form>
  </dialog>

  <script src="/static/lib.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
